<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nunofaria11</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      --bg: #f5f5f5;
      --text: #222;
      --text-muted: #666;
      --text-faint: #888;
      --text-faintest: #999;
      --hr: #ccc;
      --link: #1a0dab;
      --link-visited: #681da8;
      --link-hover: #111;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181818;
        --text: #e8e8e8;
        --text-muted: #a8a8a8;
        --text-faint: #888888;
        --text-faintest: #777777;
        --hr: #3a3a3a;
        --link: #8c8cff;
        --link-visited: #c88ce8;
        --link-hover: #ffffff;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Courier New", Courier, monospace;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
    }

    main {
      max-width: 520px;
      width: 100%;
    }

    h1 {
      font-size: 1.75rem;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 0;
    }

    hr {
      border: none;
      border-top: 1px solid var(--hr);
      margin: 1.5rem 0;
    }

    table {
      border-collapse: collapse;
    }

    td {
      padding: 0.3rem 0;
      vertical-align: top;
    }

    td:first-child {
      padding-right: 1rem;
      color: var(--text-faint);
    }

    a {
      color: var(--link);
      text-decoration: underline;
    }

    a:visited {
      color: var(--link-visited);
    }

    a:hover {
      color: var(--link-hover);
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--text-faintest);
    }
  </style>
</head>

<body>
  <main>
    <h1>Nuno Faria</h1>
    <p class="tagline">software developer / fullstack enthusiast</p>

    <hr>

    <table>
      <tr>
        <td>[github]</td>
        <td><a href="https://github.com/nunofaria11">nunofaria11</a></td>
      </tr>
      <tr>
        <td>[linkedin]</td>
        <td><a href="https://www.linkedin.com/in/nuno-faria-261924219/">Nuno Faria</a></td>
      </tr>
      <tr>
        <td>[bluesky]</td>
        <td><a href="https://bsky.app/profile/nunofaria11.dev">@nunofaria11.dev</a></td>
      </tr>
      <tr>
        <td>[x]</td>
        <td><a href="https://x.com/nunofaria11">@nunofaria11</a></td>
      </tr>
    </table>

    <hr>

    <footer>nunofaria11</footer>
  </main>
</body>

</html>
